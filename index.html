<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Catálogo de Videos · Hitec</title>
  <meta name="description" content="Catálogo de videos técnicos Hitec SRL">
  <meta name="theme-color" content="#0f172a">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Catálogo">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0f172a;
      --bg2: #1e293b;
      --bg3: #334155;
      --accent: #3b82f6;
      --accent2: #1d4ed8;
      --text: #f1f5f9;
      --text2: #94a3b8;
      --card-bg: #1e293b;
      --card-border: #334155;
      --chip-bg: #334155;
      --chip-active: #3b82f6;
      --star: #f59e0b;
      --orange: #f97316;
      --modal-bg: rgba(0,0,0,0.85);
      --radius: 12px;
      --shadow: 0 4px 24px rgba(0,0,0,0.4);
    }

    body.hc {
      --bg: #000;
      --bg2: #111;
      --bg3: #222;
      --accent: #60a5fa;
      --text: #fff;
      --text2: #ccc;
      --card-bg: #111;
      --card-border: #444;
      --chip-bg: #222;
      font-size: 17px;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    /* ── PIN SCREEN ── */
    #pin-screen {
      position: fixed; inset: 0;
      background: var(--bg);
      display: flex; align-items: center; justify-content: center;
      z-index: 1000;
      flex-direction: column;
      gap: 24px;
      padding: 32px;
    }
    #pin-screen.hidden { display: none; }

    .pin-logo {
      font-size: 1.8rem;
      font-weight: 800;
      letter-spacing: -0.5px;
      color: var(--text);
    }
    .pin-logo span { color: var(--accent); }

    .pin-box {
      background: var(--bg2);
      border: 1px solid var(--card-border);
      border-radius: var(--radius);
      padding: 32px 28px;
      width: 100%;
      max-width: 360px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      box-shadow: var(--shadow);
    }
    .pin-box h2 {
      font-size: 1.1rem;
      font-weight: 600;
      text-align: center;
      color: var(--text);
    }
    .pin-box p {
      font-size: 0.85rem;
      color: var(--text2);
      text-align: center;
    }

    /* CLAVE: input tipo password, sin restricciones numéricas */
    #pin-input {
      width: 100%;
      padding: 14px 16px;
      font-size: 1.1rem;
      background: var(--bg3);
      border: 2px solid var(--card-border);
      border-radius: 8px;
      color: var(--text);
      text-align: center;
      letter-spacing: 2px;
      outline: none;
      transition: border-color 0.2s;
      /* SIN type=number, SIN inputmode=numeric, SIN maxlength=4 */
    }
    #pin-input:focus { border-color: var(--accent); }
    #pin-input.error { border-color: #ef4444; animation: shake 0.3s; }

    @keyframes shake {
      0%,100% { transform: translateX(0); }
      25% { transform: translateX(-6px); }
      75% { transform: translateX(6px); }
    }

    .pin-error {
      font-size: 0.8rem;
      color: #ef4444;
      text-align: center;
      min-height: 18px;
    }

    .btn-primary {
      width: 100%;
      padding: 14px;
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
    }
    .btn-primary:active { background: var(--accent2); transform: scale(0.98); }

    /* ── APP ── */
    #app { display: none; flex-direction: column; min-height: 100vh; }
    #app.visible { display: flex; }

    /* Header */
    header {
      position: sticky; top: 0; z-index: 100;
      background: var(--bg);
      border-bottom: 1px solid var(--card-border);
      padding: 12px 16px;
      display: flex; flex-direction: column; gap: 10px;
    }

    .header-top {
      display: flex; align-items: center; justify-content: space-between;
      gap: 8px;
    }

    .logo {
      font-size: 1.1rem;
      font-weight: 800;
      letter-spacing: -0.3px;
      white-space: nowrap;
    }
    .logo span { color: var(--accent); }

    .header-actions {
      display: flex; align-items: center; gap: 6px;
    }

    .icon-btn {
      background: var(--bg2);
      border: 1px solid var(--card-border);
      border-radius: 8px;
      padding: 7px 9px;
      color: var(--text2);
      cursor: pointer;
      font-size: 1rem;
      display: flex; align-items: center;
      transition: color 0.2s, background 0.2s;
      line-height: 1;
    }
    .icon-btn:hover, .icon-btn.active { color: var(--text); background: var(--bg3); }

    /* Search */
    .search-wrap {
      position: relative;
    }
    #search {
      width: 100%;
      padding: 10px 14px 10px 38px;
      background: var(--bg2);
      border: 1px solid var(--card-border);
      border-radius: 8px;
      color: var(--text);
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s;
    }
    #search::placeholder { color: var(--text2); }
    #search:focus { border-color: var(--accent); }
    .search-icon {
      position: absolute; left: 12px; top: 50%; transform: translateY(-50%);
      color: var(--text2); pointer-events: none;
      font-size: 0.9rem;
    }

    /* Filter chips */
    #chips-wrap {
      padding: 0 16px 10px;
      display: flex; gap: 8px; overflow-x: auto;
      scrollbar-width: none;
    }
    #chips-wrap::-webkit-scrollbar { display: none; }

    .chip {
      flex-shrink: 0;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: 500;
      background: var(--chip-bg);
      color: var(--text2);
      border: 1px solid var(--card-border);
      cursor: pointer;
      transition: all 0.2s;
      white-space: nowrap;
    }
    .chip.active {
      background: var(--chip-active);
      color: #fff;
      border-color: var(--chip-active);
    }

    /* Count bar */
    #count-bar {
      padding: 4px 16px 8px;
      font-size: 0.78rem;
      color: var(--text2);
    }

    /* Grid / List */
    #grid {
      padding: 0 12px 80px;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      gap: 12px;
    }
    #grid.list-mode {
      grid-template-columns: 1fr;
      gap: 8px;
    }

    /* Card */
    .card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: var(--radius);
      overflow: hidden;
      cursor: pointer;
      transition: transform 0.18s, box-shadow 0.18s;
      position: relative;
    }
    .card:active { transform: scale(0.97); }

    /* List mode card */
    #grid.list-mode .card {
      display: flex;
      flex-direction: row;
      align-items: center;
      border-radius: 10px;
    }
    #grid.list-mode .thumb-wrap {
      width: 100px;
      height: 64px;
      flex-shrink: 0;
      border-radius: 0;
    }
    #grid.list-mode .card-body {
      padding: 10px 12px;
      flex: 1;
    }
    #grid.list-mode .card-title {
      font-size: 0.85rem;
      -webkit-line-clamp: 2;
    }
    #grid.list-mode .card-meta {
      font-size: 0.72rem;
    }

    /* Thumbnail */
    .thumb-wrap {
      width: 100%;
      aspect-ratio: 16/9;
      background: var(--bg3);
      position: relative;
      overflow: hidden;
    }
    .thumb-wrap img {
      width: 100%; height: 100%;
      object-fit: cover;
      display: block;
      opacity: 0;
      transition: opacity 0.3s;
    }
    .thumb-wrap img.loaded { opacity: 1; }

    /* Skeleton */
    .skeleton {
      position: absolute; inset: 0;
      background: linear-gradient(90deg, var(--bg3) 25%, var(--bg2) 50%, var(--bg3) 75%);
      background-size: 200% 100%;
      animation: shimmer 1.4s infinite;
    }
    .skeleton.hidden { display: none; }

    @keyframes shimmer {
      0% { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }

    /* Play overlay */
    .play-overlay {
      position: absolute; inset: 0;
      display: flex; align-items: center; justify-content: center;
      opacity: 0;
      transition: opacity 0.2s;
      background: rgba(0,0,0,0.3);
    }
    .card:hover .play-overlay { opacity: 1; }
    .play-icon {
      width: 36px; height: 36px;
      background: rgba(255,255,255,0.9);
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 14px;
      color: #111;
    }

    /* Orange dot — card without metadata */
    .dot-incomplete {
      position: absolute;
      top: 8px; right: 8px;
      width: 10px; height: 10px;
      border-radius: 50%;
      background: var(--orange);
      border: 2px solid var(--card-bg);
      z-index: 2;
    }

    /* Card body */
    .card-body {
      padding: 10px 10px 8px;
    }
    .card-title {
      font-size: 0.82rem;
      font-weight: 600;
      line-height: 1.35;
      color: var(--text);
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      margin-bottom: 5px;
    }
    .card-meta {
      font-size: 0.7rem;
      color: var(--text2);
      display: -webkit-box;
      -webkit-line-clamp: 1;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    /* Star favorite */
    .star-btn {
      position: absolute;
      bottom: 8px; right: 8px;
      background: none;
      border: none;
      cursor: pointer;
      font-size: 1rem;
      line-height: 1;
      padding: 4px;
      color: var(--text2);
      transition: transform 0.15s, color 0.15s;
      z-index: 2;
    }
    .star-btn.fav { color: var(--star); }
    .star-btn:active { transform: scale(1.3); }

    #grid.list-mode .star-btn {
      position: static;
      margin-left: auto;
      flex-shrink: 0;
      padding: 12px;
    }

    /* Empty state */
    #empty {
      text-align: center;
      padding: 60px 24px;
      color: var(--text2);
      font-size: 0.9rem;
      display: none;
    }

    /* Modal */
    #modal {
      position: fixed; inset: 0;
      background: var(--modal-bg);
      z-index: 500;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    #modal.open { display: flex; }

    .modal-box {
      background: var(--bg2);
      border-radius: var(--radius);
      width: 100%;
      max-width: 760px;
      box-shadow: 0 8px 48px rgba(0,0,0,0.7);
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    .modal-header {
      display: flex; align-items: flex-start; justify-content: space-between;
      padding: 14px 16px 12px;
      gap: 12px;
    }
    .modal-title {
      font-size: 0.95rem;
      font-weight: 600;
      line-height: 1.4;
      flex: 1;
    }
    .modal-close {
      background: var(--bg3);
      border: none;
      color: var(--text);
      border-radius: 6px;
      width: 30px; height: 30px;
      cursor: pointer;
      font-size: 1.1rem;
      flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
    }
    .modal-meta {
      padding: 0 16px 12px;
      font-size: 0.78rem;
      color: var(--text2);
      display: flex; flex-wrap: wrap; gap: 6px;
    }
    .meta-tag {
      background: var(--chip-bg);
      border-radius: 4px;
      padding: 2px 8px;
    }
    .video-frame {
      width: 100%;
      aspect-ratio: 16/9;
    }
    .video-frame iframe {
      width: 100%; height: 100%;
      border: none;
      display: block;
    }

    /* Loading spinner */
    #loading {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 60px;
      color: var(--text2);
      font-size: 0.9rem;
      gap: 10px;
    }
    .spinner {
      width: 20px; height: 20px;
      border: 2px solid var(--card-border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* FAB invisible scroll-to-top */
    #fab {
      position: fixed;
      bottom: 20px; right: 16px;
      width: 42px; height: 42px;
      background: var(--accent);
      border: none;
      border-radius: 50%;
      color: #fff;
      font-size: 1.1rem;
      cursor: pointer;
      display: none;
      align-items: center; justify-content: center;
      box-shadow: 0 4px 16px rgba(59,130,246,0.5);
      z-index: 200;
    }
    #fab.show { display: flex; }
  </style>
</head>
<body>

<!-- ── PIN SCREEN ── -->
<div id="pin-screen">
  <div class="pin-logo">Hitec <span>SRL</span></div>
  <div class="pin-box">
    <h2>Acceso al catálogo</h2>
    <p>Ingrese la clave de acceso</p>
    <!--
      CORRECCIÓN: input type="password" sin inputmode ni maxlength numérico.
      Acepta cualquier combinación alfanumérica como "Hitec2025".
    -->
    <input
      id="pin-input"
      type="password"
      autocomplete="current-password"
      autocorrect="off"
      autocapitalize="off"
      spellcheck="false"
      placeholder="••••••••"
    >
    <div class="pin-error" id="pin-error"></div>
    <button class="btn-primary" id="pin-btn">Ingresar</button>
  </div>
</div>

<!-- ── APP ── -->
<div id="app">

  <header>
    <div class="header-top">
      <div class="logo">Hitec <span>Catálogo</span></div>
      <div class="header-actions">
        <button class="icon-btn" id="btn-hc" title="Alto contraste">◑</button>
        <button class="icon-btn" id="btn-view" title="Cambiar vista">⊞</button>
      </div>
    </div>
    <div class="search-wrap">
      <span class="search-icon">🔍</span>
      <input id="search" type="search" placeholder="Buscar video..." autocomplete="off">
    </div>
  </header>

  <div id="chips-wrap"></div>
  <div id="count-bar"></div>
  <div id="loading"><div class="spinner"></div> Cargando catálogo…</div>
  <div id="grid"></div>
  <div id="empty">Sin resultados para esta búsqueda.</div>

</div>

<!-- Modal video -->
<div id="modal">
  <div class="modal-box">
    <div class="modal-header">
      <div class="modal-title" id="modal-title"></div>
      <button class="modal-close" id="modal-close">✕</button>
    </div>
    <div class="modal-meta" id="modal-meta"></div>
    <div class="video-frame">
      <iframe id="modal-iframe" allowfullscreen allow="autoplay"></iframe>
    </div>
  </div>
</div>

<button id="fab" title="Volver arriba">↑</button>

<script>
  // ── CONFIG ──
  const ACCESS_PIN  = 'Hitec2025';
  const PROXY_URL   = 'https://script.google.com/macros/s/AKfycbz6Mzjzueo0vdzQVyi670FTpxDvSmgXD39MVD4D0O2Wz64yHrLP-z_-hbQbJ1M0fSXTtw/exec';
  const TOKEN       = 'Hv9kP3mX7qZ';
  const CSV_URL     = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQWbuOhAfDBTsyJKONMNcf9Lw3F6aaT1-Ovrif_ixyclRT1HeNNKdg415q4NZ74XchXvyUstM2Xfqyh/pub?gid=1463725900&single=true&output=csv';

  // ── STATE ──
  let videos        = [];
  let favorites     = JSON.parse(localStorage.getItem('hc_favs') || '[]');
  let activeChip    = null;
  let listMode      = localStorage.getItem('hc_view') === 'list';
  let highContrast  = localStorage.getItem('hc_hc') === '1';

  // ── PIN LOGIC ──
  const pinScreen = document.getElementById('pin-screen');
  const pinInput  = document.getElementById('pin-input');
  const pinBtn    = document.getElementById('pin-btn');
  const pinError  = document.getElementById('pin-error');
  const app       = document.getElementById('app');

  function checkPin() {
    const val = pinInput.value.trim();
    if (val === ACCESS_PIN) {
      sessionStorage.setItem('hc_auth', '1');
      pinScreen.classList.add('hidden');
      app.classList.add('visible');
      initApp();
    } else {
      pinError.textContent = 'Clave incorrecta. Intente de nuevo.';
      pinInput.classList.add('error');
      pinInput.value = '';
      setTimeout(() => pinInput.classList.remove('error'), 500);
    }
  }

  pinBtn.addEventListener('click', checkPin);
  pinInput.addEventListener('keydown', e => { if (e.key === 'Enter') checkPin(); });

  // Auto-login si ya autenticó en esta sesión
  if (sessionStorage.getItem('hc_auth') === '1') {
    pinScreen.classList.add('hidden');
    app.classList.add('visible');
    initApp();
  }

  // ── CSV PARSER ──
  function parseCSV(text) {
    const rows = [];
    let cur = '', inQ = false;
    const fields = [];
    const push = () => { fields.push(cur); cur = ''; };

    for (let i = 0; i < text.length; i++) {
      const c = text[i];
      if (c === '"') {
        if (inQ && text[i+1] === '"') { cur += '"'; i++; }
        else inQ = !inQ;
      } else if (c === ',' && !inQ) {
        push();
      } else if ((c === '\n' || c === '\r') && !inQ) {
        push();
        if (fields.length > 1 || fields[0]) rows.push([...fields]);
        fields.length = 0;
        if (c === '\r' && text[i+1] === '\n') i++;
      } else {
        cur += c;
      }
    }
    push();
    if (fields.length > 1 || fields[0]) rows.push([...fields]);
    return rows;
  }

  function extractId(url) {
    const m = url && url.match(/\/d\/([\w-]+)/);
    return m ? m[1] : null;
  }

  function thumbUrl(fileId) {
    return `${PROXY_URL}?id=${fileId}&token=${TOKEN}`;
  }

  // ── INIT ──
  function initApp() {
    applyPrefs();
    fetchData();
  }

  function applyPrefs() {
    document.body.classList.toggle('hc', highContrast);
    document.getElementById('btn-hc').classList.toggle('active', highContrast);

    const grid = document.getElementById('grid');
    grid.classList.toggle('list-mode', listMode);
    document.getElementById('btn-view').textContent = listMode ? '⊟' : '⊞';
    document.getElementById('btn-view').classList.toggle('active', listMode);
  }

  async function fetchData() {
    try {
      const res = await fetch(CSV_URL + '&t=' + Date.now());
      const text = await res.text();
      const rows = parseCSV(text);

      // Primera fila = headers
      const headers = rows[0].map(h => h.trim().toLowerCase());
      const nameIdx = headers.findIndex(h => h.includes('nombre'));
      const catIdx  = headers.findIndex(h => h.includes('categor'));
      const typeIdx = headers.findIndex(h => h.includes('tipo'));
      const equipIdx= headers.findIndex(h => h.includes('equipo'));
      const indIdx  = headers.findIndex(h => h.includes('industria') || h.includes('rubro'));
      const linkIdx = headers.findIndex(h => h.includes('link') || h.includes('video'));

      videos = rows.slice(1).map((r, i) => ({
        id: i,
        name: (r[nameIdx] || '').trim(),
        cat:  (r[catIdx]  || '').trim(),
        type: (r[typeIdx] || '').trim(),
        equip:(r[equipIdx]|| '').trim(),
        ind:  (r[indIdx]  || '').trim(),
        link: (r[linkIdx] || '').trim(),
        fileId: extractId((r[linkIdx] || '').trim()),
      })).filter(v => v.name && v.link);

      document.getElementById('loading').style.display = 'none';
      buildChips();
      renderCards();
    } catch(e) {
      document.getElementById('loading').innerHTML =
        '⚠️ Error al cargar el catálogo.<br><small style="opacity:.6">' + e.message + '</small>';
    }
  }

  // ── CHIPS ──
  function buildChips() {
    const cats = [...new Set(videos.map(v => v.cat).filter(Boolean))].sort();
    const wrap = document.getElementById('chips-wrap');
    wrap.innerHTML = '';

    const all = chip('Todos', null);
    wrap.appendChild(all);
    if (favorites.length) wrap.appendChild(chip('⭐ Favoritos', '__favs__'));
    cats.forEach(c => wrap.appendChild(chip(c, c)));
  }

  function chip(label, value) {
    const el = document.createElement('button');
    el.className = 'chip' + (activeChip === value ? ' active' : '');
    el.textContent = label;
    el.addEventListener('click', () => {
      activeChip = activeChip === value ? null : value;
      document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
      el.classList.toggle('active', activeChip === value);
      if (activeChip === null) all.classList.add('active');
      renderCards();
    });
    const all = el; // alias for Todos
    if (value === null) el.classList.add('active');
    return el;
  }

  // ── RENDER ──
  function renderCards() {
    const q    = document.getElementById('search').value.trim().toLowerCase();
    const grid = document.getElementById('grid');
    const empty= document.getElementById('empty');
    grid.innerHTML = '';

    let filtered = videos;

    if (activeChip === '__favs__') {
      filtered = filtered.filter(v => favorites.includes(v.id));
    } else if (activeChip) {
      filtered = filtered.filter(v => v.cat === activeChip);
    }

    if (q) {
      filtered = filtered.filter(v =>
        v.name.toLowerCase().includes(q) ||
        v.cat.toLowerCase().includes(q)  ||
        v.type.toLowerCase().includes(q) ||
        v.equip.toLowerCase().includes(q)||
        v.ind.toLowerCase().includes(q)
      );
    }

    // Favoritos primero
    filtered.sort((a, b) => {
      const af = favorites.includes(a.id);
      const bf = favorites.includes(b.id);
      return bf - af;
    });

    const countBar = document.getElementById('count-bar');
    countBar.textContent = filtered.length === videos.length
      ? `${videos.length} videos`
      : `${filtered.length} de ${videos.length} videos`;

    if (!filtered.length) {
      empty.style.display = 'block';
      return;
    }
    empty.style.display = 'none';

    filtered.forEach(v => grid.appendChild(buildCard(v)));
  }

  function buildCard(v) {
    const isFav = favorites.includes(v.id);
    const hasNoMeta = !v.cat && !v.type && !v.equip && !v.ind;
    const metaStr = [v.cat, v.type].filter(Boolean).join(' · ') || (v.ind || '');

    const card = document.createElement('div');
    card.className = 'card';

    // Orange dot
    if (hasNoMeta) {
      const dot = document.createElement('div');
      dot.className = 'dot-incomplete';
      dot.title = 'Sin metadatos completados';
      card.appendChild(dot);
    }

    // Thumbnail
    const thumbWrap = document.createElement('div');
    thumbWrap.className = 'thumb-wrap';

    const skel = document.createElement('div');
    skel.className = 'skeleton';

    const img = document.createElement('img');
    img.alt = v.name;
    if (v.fileId) {
      img.src = thumbUrl(v.fileId);
      img.addEventListener('load', () => {
        img.classList.add('loaded');
        skel.classList.add('hidden');
      });
      img.addEventListener('error', () => {
        skel.classList.add('hidden');
        thumbWrap.style.background = 'var(--bg3)';
      });
    } else {
      skel.classList.add('hidden');
    }

    const playOver = document.createElement('div');
    playOver.className = 'play-overlay';
    playOver.innerHTML = '<div class="play-icon">▶</div>';

    thumbWrap.appendChild(skel);
    thumbWrap.appendChild(img);
    thumbWrap.appendChild(playOver);

    // Body
    const body = document.createElement('div');
    body.className = 'card-body';

    const title = document.createElement('div');
    title.className = 'card-title';
    title.textContent = v.name;

    const meta = document.createElement('div');
    meta.className = 'card-meta';
    meta.textContent = metaStr;

    body.appendChild(title);
    if (metaStr) body.appendChild(meta);

    // Star
    const star = document.createElement('button');
    star.className = 'star-btn' + (isFav ? ' fav' : '');
    star.textContent = isFav ? '★' : '☆';
    star.title = isFav ? 'Quitar de favoritos' : 'Agregar a favoritos';
    star.addEventListener('click', e => {
      e.stopPropagation();
      toggleFav(v.id, star);
    });

    card.appendChild(thumbWrap);
    card.appendChild(body);
    card.appendChild(star);

    card.addEventListener('click', () => openModal(v));

    return card;
  }

  // ── FAVORITES ──
  function toggleFav(id, btn) {
    const idx = favorites.indexOf(id);
    if (idx === -1) {
      favorites.push(id);
      btn.textContent = '★';
      btn.classList.add('fav');
      btn.title = 'Quitar de favoritos';
    } else {
      favorites.splice(idx, 1);
      btn.textContent = '☆';
      btn.classList.remove('fav');
      btn.title = 'Agregar a favoritos';
    }
    localStorage.setItem('hc_favs', JSON.stringify(favorites));
    buildChips();
  }

  // ── MODAL ──
  function openModal(v) {
    document.getElementById('modal-title').textContent = v.name;

    const metaEl = document.getElementById('modal-meta');
    metaEl.innerHTML = '';
    [v.cat, v.type, v.equip, v.ind].filter(Boolean).forEach(m => {
      const tag = document.createElement('span');
      tag.className = 'meta-tag';
      tag.textContent = m;
      metaEl.appendChild(tag);
    });

    document.getElementById('modal-iframe').src = v.link;
    document.getElementById('modal').classList.add('open');
    document.body.style.overflow = 'hidden';
  }

  function closeModal() {
    document.getElementById('modal').classList.remove('open');
    document.getElementById('modal-iframe').src = '';
    document.body.style.overflow = '';
  }

  document.getElementById('modal-close').addEventListener('click', closeModal);
  document.getElementById('modal').addEventListener('click', e => {
    if (e.target === document.getElementById('modal')) closeModal();
  });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

  // ── SEARCH ──
  let searchTimer;
  document.getElementById('search').addEventListener('input', () => {
    clearTimeout(searchTimer);
    searchTimer = setTimeout(renderCards, 220);
  });

  // ── VIEW TOGGLE ──
  document.getElementById('btn-view').addEventListener('click', () => {
    listMode = !listMode;
    localStorage.setItem('hc_view', listMode ? 'list' : 'grid');
    applyPrefs();
    renderCards();
  });

  // ── HIGH CONTRAST ──
  document.getElementById('btn-hc').addEventListener('click', () => {
    highContrast = !highContrast;
    localStorage.setItem('hc_hc', highContrast ? '1' : '0');
    applyPrefs();
  });

  // ── FAB scroll to top ──
  const fab = document.getElementById('fab');
  window.addEventListener('scroll', () => {
    fab.classList.toggle('show', window.scrollY > 300);
  });
  fab.addEventListener('click', () => window.scrollTo({ top: 0, behavior: 'smooth' }));

  // ── SERVICE WORKER ──
  // Desregistra SWs viejos antes de registrar el nuevo (evita cachés obsoletas)
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.getRegistrations().then(regs => {
      regs.forEach(r => r.unregister());
    }).then(() => {
      navigator.serviceWorker.register('sw.js').catch(() => {});
    });
  }
</script>
</body>
</html>
