<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Catálogo de Videos · Hitec</title>
  <meta name="description" content="Catálogo de videos técnicos Hitec SRL">
  <meta name="theme-color" content="#073e4a">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Catálogo">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      /* ── Fondos — teal oscuro marca Hitec (extraído del brand image) ── */
      --bg:  #073e4a;            /* Fondo principal: teal profundo */
      --bg2: #094c5a;            /* Cards y superficies */
      --bg3: #0c5e70;            /* Inputs y elementos elevados */

      /* ── Acento Hitec oficial ── */
      --accent:       #26A591;   /* Teal oficial primario */
      --accent2:      #1d8073;   /* Hover / pressed */
      --accent-light: #00BFB3;   /* Pantone 3262C — highlights */
      --accent-alt:   #00C389;   /* Pantone 3395C — detalle verde */
      --accent-muted: #052e38;   /* Teal muy oscuro para fondos sutiles */

      /* ── Texto ── */
      --text:  #e8f5f3;          /* Blanco con tinte teal */
      --text2: #8eccc4;          /* Gris-teal apagado */

      /* ── Cards y bordes ── */
      --card-bg:     #094c5a;
      --card-border: #126070;    /* Teal medio para bordes */

      /* ── Chips ── */
      --chip-bg:     #073a46;
      --chip-active: #26A591;

      /* ── Separadores ── */
      --sep:         #0a5060;
      --sep-light:   rgba(38,165,145,0.15);

      /* ── Otros ── */
      --star:      #f5c842;      /* Dorado — eco de los puntos del brand image */
      --orange:    #f97316;
      --modal-bg:  rgba(4,22,28,0.95);
      --radius:    12px;
      --shadow:    0 4px 28px rgba(0,0,0,0.6);
    }

    body.hc {
      --bg:          #021a20;
      --bg2:         #032830;
      --bg3:         #053540;
      --accent:      #2ecfb8;
      --accent2:     #23a594;
      --accent-light:#00e5d4;
      --accent-alt:  #00e0a0;
      --accent-muted:#021820;
      --text:        #fff;
      --text2:       #a0ddd6;
      --card-bg:     #032830;
      --card-border: #0a5060;
      --chip-bg:     #032830;
      --sep:         #0a5060;
      font-size: 17px;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    /* ── PIN SCREEN ── */
    #pin-screen {
      position: fixed; inset: 0;
      background: var(--bg);
      display: flex; align-items: center; justify-content: center;
      z-index: 1000;
      flex-direction: column;
      gap: 24px;
      padding: 32px;
    }
    #pin-screen.hidden { display: none; }

    .pin-logo {
      font-size: 1.8rem;
      font-weight: 800;
      letter-spacing: -0.5px;
      color: var(--text);
    }
    .pin-logo span { color: var(--accent); }

    .pin-box {
      background: var(--bg2);
      border: 1px solid var(--card-border);
      border-radius: var(--radius);
      padding: 32px 28px;
      width: 100%;
      max-width: 360px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      box-shadow: var(--shadow);
    }
    .pin-box h2 {
      font-size: 1.1rem;
      font-weight: 600;
      text-align: center;
      color: var(--text);
    }
    .pin-box p {
      font-size: 0.85rem;
      color: var(--text2);
      text-align: center;
    }

    /* Input de clave: tipo text para que acepte letras/números/símbolos en móvil */
    #pin-input {
      width: 100%;
      padding: 14px 16px;
      font-size: 1.1rem;
      background: var(--bg3);
      border: 2px solid var(--card-border);
      border-radius: 8px;
      color: var(--text);
      text-align: center;
      letter-spacing: 2px;
      outline: none;
      transition: border-color 0.2s;
      -webkit-text-security: disc; /* Oculta caracteres en WebKit como password */
    }
    #pin-input:focus { border-color: var(--accent); }
    #pin-input.error { border-color: #ef4444; animation: shake 0.3s; }

    @keyframes shake {
      0%,100% { transform: translateX(0); }
      25% { transform: translateX(-6px); }
      75% { transform: translateX(6px); }
    }

    .pin-error {
      font-size: 0.8rem;
      color: #ef4444;
      text-align: center;
      min-height: 18px;
    }

    .btn-primary {
      width: 100%;
      padding: 14px;
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
    }
    .btn-primary:active { background: var(--accent2); transform: scale(0.98); }

    /* ── APP ── */
    #app { display: none; flex-direction: column; min-height: 100vh; }
    #app.visible { display: flex; }

    /* Header */
    header {
      position: sticky; top: 0; z-index: 100;
      background: var(--bg);
      border-bottom: 1px solid transparent;
      border-image: linear-gradient(90deg, var(--accent) 0%, var(--accent-light) 50%, var(--accent-alt) 100%) 1;
      padding: 12px 16px;
      display: flex; flex-direction: column; gap: 10px;
    }

    .header-top {
      display: flex; align-items: center; justify-content: space-between;
      gap: 8px;
    }

    .logo {
      font-size: 1.1rem;
      font-weight: 800;
      letter-spacing: -0.3px;
      white-space: nowrap;
    }
    .logo span { color: var(--accent); }

    .header-actions {
      display: flex; align-items: center; gap: 6px;
    }

    .icon-btn {
      background: var(--bg2);
      border: 1px solid var(--card-border);
      border-radius: 8px;
      padding: 7px 9px;
      color: var(--text2);
      cursor: pointer;
      font-size: 1rem;
      display: flex; align-items: center;
      transition: color 0.2s, background 0.2s;
      line-height: 1;
    }
    .icon-btn:hover, .icon-btn.active { color: var(--text); background: var(--bg3); }

    /* Search */
    .search-wrap { position: relative; }
    #search {
      width: 100%;
      padding: 10px 14px 10px 38px;
      background: var(--bg2);
      border: 1px solid var(--card-border);
      border-radius: 8px;
      color: var(--text);
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s;
    }
    #search::placeholder { color: var(--text2); }
    #search:focus { border-color: var(--accent); }
    .search-icon {
      position: absolute; left: 12px; top: 50%; transform: translateY(-50%);
      color: var(--text2); pointer-events: none;
      font-size: 0.9rem;
    }

    /* Filter chips */
    #chips-wrap {
      padding: 0 16px 10px;
      display: flex; gap: 8px; overflow-x: auto;
      scrollbar-width: none;
    }
    #chips-wrap::-webkit-scrollbar { display: none; }

    .chip {
      flex-shrink: 0;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: 500;
      background: var(--chip-bg);
      color: var(--text2);
      border: 1px solid var(--card-border);
      cursor: pointer;
      transition: all 0.2s;
      white-space: nowrap;
    }
    .chip.active {
      background: var(--chip-active);
      color: #fff;
      border-color: var(--chip-active);
    }

    /* Count bar */
    #count-bar {
      padding: 4px 16px 8px;
      font-size: 0.78rem;
      color: var(--text2);
    }
    #count-bar span { color: var(--accent-alt); font-weight: 600; }

    /* Grid / List */
    #grid {
      padding: 0 12px 80px;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      gap: 12px;
    }
    #grid.list-mode {
      grid-template-columns: 1fr;
      gap: 8px;
    }

    /* Card */
    .card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: var(--radius);
      overflow: hidden;
      cursor: pointer;
      transition: transform 0.18s, box-shadow 0.18s, border-color 0.18s;
      position: relative;
    }
    .card:hover  { border-color: var(--accent); box-shadow: 0 0 0 1px var(--sep-light); }
    .card:active { transform: scale(0.97); }

    /* List mode card */
    #grid.list-mode .card {
      display: flex;
      flex-direction: row;
      align-items: center;
      border-radius: 10px;
    }
    #grid.list-mode .thumb-wrap {
      width: 100px;
      height: 64px;
      flex-shrink: 0;
      border-radius: 0;
    }
    #grid.list-mode .card-body {
      padding: 10px 12px;
      flex: 1;
    }
    #grid.list-mode .card-title {
      font-size: 0.85rem;
      -webkit-line-clamp: 2;
    }
    #grid.list-mode .card-meta { font-size: 0.72rem; }

    /* Thumbnail */
    .thumb-wrap {
      width: 100%;
      aspect-ratio: 16/9;
      background: var(--bg3);
      position: relative;
      overflow: hidden;
    }
    .thumb-wrap img {
      width: 100%; height: 100%;
      object-fit: cover;
      display: block;
      opacity: 0;
      transition: opacity 0.3s;
    }
    .thumb-wrap img.loaded { opacity: 1; }

    /* Skeleton shimmer */
    .skeleton {
      position: absolute; inset: 0;
      background: linear-gradient(90deg, var(--bg3) 25%, var(--bg2) 50%, var(--bg3) 75%);
      background-size: 200% 100%;
      animation: shimmer 1.4s infinite;
    }
    .skeleton.hidden { display: none; }

    @keyframes shimmer {
      0% { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }

    /* Placeholder cuando no hay miniatura */
    .thumb-placeholder {
      position: absolute; inset: 0;
      display: flex; align-items: center; justify-content: center;
      font-size: 2rem;
      opacity: 0.25;
    }
    .thumb-placeholder.hidden { display: none; }

    /* Play overlay */
    .play-overlay {
      position: absolute; inset: 0;
      display: flex; align-items: center; justify-content: center;
      opacity: 0;
      transition: opacity 0.2s;
      background: rgba(0,0,0,0.3);
    }
    .card:hover .play-overlay { opacity: 1; }
    .play-icon {
      width: 36px; height: 36px;
      background: rgba(255,255,255,0.9);
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 14px;
      color: #111;
    }

    /* Orange dot – card sin metadatos */
    .dot-incomplete {
      position: absolute;
      top: 8px; right: 8px;
      width: 10px; height: 10px;
      border-radius: 50%;
      background: var(--orange);
      border: 2px solid var(--card-bg);
      z-index: 2;
    }

    /* Card body */
    .card-body {
      padding: 10px 10px 8px;
    }
    .card-title {
      font-size: 0.82rem;
      font-weight: 600;
      line-height: 1.35;
      color: var(--text);
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      margin-bottom: 5px;
    }
    .card-meta {
      font-size: 0.7rem;
      color: var(--text2);
      display: -webkit-box;
      -webkit-line-clamp: 1;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    /* Star favorite */
    .star-btn {
      position: absolute;
      bottom: 8px; right: 8px;
      background: none;
      border: none;
      cursor: pointer;
      font-size: 1rem;
      line-height: 1;
      padding: 4px;
      color: var(--text2);
      transition: transform 0.15s, color 0.15s;
      z-index: 2;
    }
    .star-btn.fav { color: var(--star); }
    .star-btn:active { transform: scale(1.3); }

    #grid.list-mode .star-btn {
      position: static;
      margin-left: auto;
      flex-shrink: 0;
      padding: 12px;
    }

    /* Empty state */
    #empty {
      text-align: center;
      padding: 60px 24px;
      color: var(--text2);
      font-size: 0.9rem;
      display: none;
    }

    /* ── MODAL ── */
    #modal {
      position: fixed; inset: 0;
      background: var(--modal-bg);
      z-index: 500;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 12px;
    }
    #modal.open { display: flex; }

    .modal-box {
      background: var(--bg2);
      border-radius: var(--radius);
      width: 100%;
      max-width: 860px;
      box-shadow: 0 8px 48px rgba(0,0,0,0.7);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      /* Se adapta a la altura disponible sin cortar el video */
      max-height: calc(100vh - 24px);
    }

    /* En móvil: centrado, ocupa casi todo el ancho */
    @media (max-width: 600px) {
      #modal {
        padding: 8px;
        align-items: center;
        justify-content: center;
      }
      .modal-box {
        border-radius: var(--radius);
        width: 100%;
        max-height: 96vh;
      }
      .modal-header { padding: 10px 12px 8px; }
      .modal-meta   { padding: 0 12px 8px; }
      .modal-footer { padding: 6px 12px; }
    }
    .modal-header {
      display: flex; align-items: flex-start; justify-content: space-between;
      padding: 14px 16px 10px;
      gap: 12px;
      flex-shrink: 0;
    }
    .modal-title {
      font-size: 0.95rem;
      font-weight: 600;
      line-height: 1.4;
      flex: 1;
    }
    .modal-close {
      background: var(--bg3);
      border: none;
      color: var(--text);
      border-radius: 6px;
      width: 32px; height: 32px;
      cursor: pointer;
      font-size: 1.1rem;
      flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      transition: background 0.2s;
    }
    .modal-close:hover { background: #475569; }

    .modal-meta {
      padding: 0 16px 10px;
      font-size: 0.78rem;
      color: var(--text2);
      display: flex; flex-wrap: wrap; gap: 6px;
      flex-shrink: 0;
    }
    .meta-tag {
      background: var(--chip-bg);
      border-radius: 4px;
      padding: 2px 8px;
    }

    /* Contenedor del video: siempre 16:9 responsive */
    .video-wrap {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #000;
      overflow: hidden;
      flex-shrink: 0;
    }
    .video-wrap iframe {
      position: absolute; inset: 0;
      width: 100%; height: 100%;
      border: none;
      display: block;
    }

    /* Spinner de carga dentro del modal */
    .video-loading {
      position: absolute; inset: 0;
      display: flex; align-items: center; justify-content: center;
      background: #000;
      z-index: 1;
      pointer-events: none;
    }
    .video-loading.hidden { display: none; }
    .video-spinner {
      width: 32px; height: 32px;
      border: 3px solid rgba(255,255,255,0.15);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }

    /* Link "Abrir en Drive" siempre visible pero discreto */
    .modal-footer {
      padding: 8px 16px;
      font-size: 0.75rem;
      color: var(--text2);
      text-align: right;
      flex-shrink: 0;
      border-top: 1px solid var(--sep);
      background: var(--accent-muted);
    }
    .modal-footer a {
      color: var(--accent-light);
      text-decoration: none;
    }
    .modal-footer a:hover { color: var(--accent-alt); text-decoration: underline; }

    /* Loading inicial */
    #loading {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 60px;
      color: var(--text2);
      font-size: 0.9rem;
      gap: 10px;
    }
    .spinner {
      width: 20px; height: 20px;
      border: 2px solid var(--card-border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* FAB scroll-to-top */
    #fab {
      position: fixed;
      bottom: 20px; right: 16px;
      width: 42px; height: 42px;
      background: var(--accent);
      border: none;
      border-radius: 50%;
      color: #fff;
      font-size: 1.1rem;
      cursor: pointer;
      display: none;
      align-items: center; justify-content: center;
      box-shadow: 0 4px 16px rgba(38,165,145,0.5);
      z-index: 200;
    }
    #fab.show { display: flex; }

    /* Error de carga */
    #load-error {
      display: none;
      text-align: center;
      padding: 40px 24px;
      color: var(--text2);
      font-size: 0.88rem;
      line-height: 1.6;
    }
    #load-error strong { color: var(--text); display: block; margin-bottom: 6px; }
  </style>
</head>
<body>

<!-- ── PIN SCREEN ── -->
<div id="pin-screen">
  <div class="pin-logo">Hitec <span>SRL</span></div>
  <div class="pin-box">
    <h2>Acceso al catálogo</h2>
    <p>Ingrese la clave de acceso</p>
    <!--
      type="text" + inputmode="text" para que el teclado móvil
      permita letras y números. -webkit-text-security: disc en CSS
      oculta los caracteres visualmente (como password).
    -->
    <input
      id="pin-input"
      type="text"
      inputmode="text"
      autocomplete="off"
      autocorrect="off"
      autocapitalize="off"
      spellcheck="false"
      placeholder="••••••••"
    >
    <div class="pin-error" id="pin-error"></div>
    <button class="btn-primary" id="pin-btn">Ingresar</button>
  </div>
</div>

<!-- ── APP ── -->
<div id="app">

  <header>
    <div class="header-top">
      <div class="logo">Hitec <span>Catálogo</span></div>
      <div class="header-actions">
        <button class="icon-btn" id="btn-hc" title="Alto contraste">◑</button>
        <button class="icon-btn" id="btn-view" title="Cambiar vista">⊞</button>
      </div>
    </div>
    <div class="search-wrap">
      <span class="search-icon">🔍</span>
      <input id="search" type="search" placeholder="Buscar video..." autocomplete="off">
    </div>
  </header>

  <div id="chips-wrap"></div>
  <div id="count-bar"></div>
  <div id="loading"><div class="spinner"></div> Cargando catálogo…</div>
  <div id="load-error"></div>
  <div id="grid"></div>
  <div id="empty">Sin resultados para esta búsqueda.</div>

</div>

<!-- ── MODAL DE VIDEO ── -->
<div id="modal" role="dialog" aria-modal="true">
  <div class="modal-box">
    <div class="modal-header">
      <div class="modal-title" id="modal-title"></div>
      <button class="modal-close" id="modal-close" aria-label="Cerrar">✕</button>
    </div>
    <div class="modal-meta" id="modal-meta"></div>
    <div class="video-wrap" id="video-wrap">
      <div class="video-loading" id="video-loading">
        <div class="video-spinner"></div>
      </div>
      <!-- iframe se inserta dinámicamente -->
    </div>
    <div class="modal-footer">
      <a id="drive-link" href="#" target="_blank" rel="noopener">↗ Abrir en Google Drive</a>
    </div>
  </div>
</div>

<button id="fab" title="Volver arriba">↑</button>

<script>
  // ── CONFIG ──────────────────────────────────────────────────────────
  const ACCESS_PIN = 'Hitec2025';

  // URL del Sheet publicado como CSV (hoja correcta, gid=1463725900)
  const CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQWbuOhAfDBTsyJKONMNcf9Lw3F6aaT1-Ovrif_ixyclRT1HeNNKdg415q4NZ74XchXvyUstM2Xfqyh/pub?gid=1463725900&single=true&output=csv';

  // ── STATE ────────────────────────────────────────────────────────────
  let videos       = [];
  let favorites    = JSON.parse(localStorage.getItem('hc_favs') || '[]');
  let activeChip   = null;
  let listMode     = localStorage.getItem('hc_view') === 'list';
  let highContrast = localStorage.getItem('hc_hc') === '1';
  let currentVideo = null;

  // ── HELPERS ──────────────────────────────────────────────────────────

  // Asegura formato /preview en links de Drive
  function normalizeLink(url) {
    if (!url) return '';
    url = url.trim();
    if (!url.startsWith('http://') && !url.startsWith('https://')) {
      url = url.startsWith('//') ? 'https:' + url : 'https://' + url;
    }
    if (url.includes('drive.google.com') && !url.includes('/preview') && !url.includes('export=') && !url.includes('thumbnail')) {
      url = url.replace('/view', '/preview');
      if (!url.endsWith('/preview')) {
        url = url.replace(/\/file\/d\/([^/]+)\/?$/, '/file/d/$1/preview');
      }
    }
    return url;
  }

  // Extrae el ID de archivo de una URL de Drive
  function extractId(url) {
    const m = url && url.match(/\/d\/([^/?&#]+)/);
    return m ? m[1] : null;
  }

  // Genera URL de miniatura con fallback
  // Google Drive thumbnail: funciona si el usuario tiene acceso y está logueado en Google
  function thumbUrl(fileId) {
    return `https://drive.google.com/thumbnail?id=${fileId}&sz=w400-h225`;
  }
  function thumbUrlFallback(fileId) {
    // Formato alternativo de Google
    return `https://lh3.googleusercontent.com/d/${fileId}=w400-h225`;
  }

  // ── PIN ──────────────────────────────────────────────────────────────
  const pinScreen = document.getElementById('pin-screen');
  const pinInput  = document.getElementById('pin-input');
  const pinBtn    = document.getElementById('pin-btn');
  const pinError  = document.getElementById('pin-error');
  const app       = document.getElementById('app');

  function checkPin() {
    const val = pinInput.value.trim();
    if (val === ACCESS_PIN) {
      sessionStorage.setItem('hc_auth', '1');
      pinScreen.classList.add('hidden');
      app.classList.add('visible');
      initApp();
    } else {
      pinError.textContent = 'Clave incorrecta. Intente de nuevo.';
      pinInput.classList.add('error');
      pinInput.value = '';
      setTimeout(() => pinInput.classList.remove('error'), 500);
    }
  }

  pinBtn.addEventListener('click', checkPin);
  pinInput.addEventListener('keydown', e => { if (e.key === 'Enter') checkPin(); });

  // Auto-login si ya autenticó en esta sesión del navegador
  if (sessionStorage.getItem('hc_auth') === '1') {
    pinScreen.classList.add('hidden');
    app.classList.add('visible');
    initApp();
  }

  // ── CSV PARSER ───────────────────────────────────────────────────────
  function parseCSV(text) {
    const rows = [];
    let cur = '', inQ = false;
    const fields = [];
    const push = () => { fields.push(cur); cur = ''; };

    for (let i = 0; i < text.length; i++) {
      const c = text[i];
      if (c === '"') {
        if (inQ && text[i+1] === '"') { cur += '"'; i++; }
        else inQ = !inQ;
      } else if (c === ',' && !inQ) {
        push();
      } else if ((c === '\n' || c === '\r') && !inQ) {
        push();
        if (fields.length > 1 || fields[0]) rows.push([...fields]);
        fields.length = 0;
        if (c === '\r' && text[i+1] === '\n') i++;
      } else {
        cur += c;
      }
    }
    push();
    if (fields.length > 1 || fields[0]) rows.push([...fields]);
    return rows;
  }

  // ── INIT ─────────────────────────────────────────────────────────────
  function initApp() {
    applyPrefs();
    fetchData();
  }

  function applyPrefs() {
    document.body.classList.toggle('hc', highContrast);
    document.getElementById('btn-hc').classList.toggle('active', highContrast);
    const grid = document.getElementById('grid');
    grid.classList.toggle('list-mode', listMode);
    document.getElementById('btn-view').textContent = listMode ? '⊟' : '⊞';
    document.getElementById('btn-view').classList.toggle('active', listMode);
  }

  async function fetchData() {
    const loadingEl = document.getElementById('loading');
    const errorEl   = document.getElementById('load-error');
    loadingEl.style.display = 'flex';
    errorEl.style.display   = 'none';

    // Agregar timestamp para evitar caché del navegador en la petición fetch
    const url = CSV_URL + '&_t=' + Date.now();

    try {
      const res = await fetch(url, { cache: 'no-store' });
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const text = await res.text();
      const rows = parseCSV(text);

      if (!rows.length) throw new Error('El archivo CSV está vacío.');

      // Detectar columnas por nombre de header
      const headers  = rows[0].map(h => h.trim().toLowerCase());
      const nameIdx  = headers.findIndex(h => h.includes('nombre'));
      const catIdx   = headers.findIndex(h => h.includes('categor'));
      const typeIdx  = headers.findIndex(h => h.includes('tipo'));
      const equipIdx = headers.findIndex(h => h.includes('equipo'));
      const indIdx   = headers.findIndex(h => h.includes('industria') || h.includes('rubro'));
      const linkIdx  = headers.findIndex(h => h.includes('link'));

      if (nameIdx === -1 || linkIdx === -1) {
        throw new Error('No se encontraron las columnas "Nombre del Video" y "Link al Video" en el Sheet.');
      }

      videos = rows.slice(1).map((r, i) => {
        const rawLink = (r[linkIdx] || '').trim();
        const link    = normalizeLink(rawLink);
        return {
          id:     i,
          name:   (r[nameIdx]  || '').trim(),
          cat:    (r[catIdx]   || '').trim(),
          type:   (r[typeIdx]  || '').trim(),
          equip:  (r[equipIdx] || '').trim(),
          ind:    (r[indIdx]   || '').trim(),
          link,
          fileId: extractId(link),
        };
      }).filter(v => v.name && v.link);

      loadingEl.style.display = 'none';
      buildChips();
      renderCards();

    } catch (e) {
      loadingEl.style.display = 'none';
      errorEl.style.display   = 'block';
      errorEl.innerHTML = `
        <strong>No se pudo cargar el catálogo</strong>
        ${e.message}<br>
        <small style="opacity:.6">Verifique la conexión y que el Sheet esté publicado correctamente.</small>
        <br><br>
        <button onclick="fetchData()" style="padding:8px 20px;background:var(--accent);color:#fff;border:none;border-radius:8px;cursor:pointer;font-size:0.9rem;">
          Reintentar
        </button>`;
    }
  }

  // ── CHIPS ────────────────────────────────────────────────────────────
  function buildChips() {
    const cats = [...new Set(videos.map(v => v.cat).filter(Boolean))].sort();
    const wrap = document.getElementById('chips-wrap');
    wrap.innerHTML = '';
    wrap.appendChild(chip('Todos', null));
    if (favorites.length) wrap.appendChild(chip('❤ Favoritos', '__favs__'));
    cats.forEach(c => wrap.appendChild(chip(c, c)));
  }

  function chip(label, value) {
    const el = document.createElement('button');
    el.className = 'chip' + (activeChip === value ? ' active' : '');
    el.textContent = label;
    el.addEventListener('click', () => {
      activeChip = activeChip === value ? null : value;
      document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
      if (activeChip === null) {
        document.querySelector('.chip').classList.add('active');
      } else {
        el.classList.add('active');
      }
      renderCards();
    });
    if (value === null) el.classList.add('active');
    return el;
  }

  // ── RENDER ───────────────────────────────────────────────────────────
  function renderCards() {
    const q     = document.getElementById('search').value.trim().toLowerCase();
    const grid  = document.getElementById('grid');
    const empty = document.getElementById('empty');
    grid.innerHTML = '';

    let filtered = videos;

    if (activeChip === '__favs__') {
      filtered = filtered.filter(v => favorites.includes(v.id));
    } else if (activeChip) {
      filtered = filtered.filter(v => v.cat === activeChip);
    }

    if (q) {
      filtered = filtered.filter(v =>
        v.name.toLowerCase().includes(q)  ||
        v.cat.toLowerCase().includes(q)   ||
        v.type.toLowerCase().includes(q)  ||
        v.equip.toLowerCase().includes(q) ||
        v.ind.toLowerCase().includes(q)
      );
    }

    // Favoritos primero
    filtered.sort((a, b) => favorites.includes(b.id) - favorites.includes(a.id));

    const countBar = document.getElementById('count-bar');
    countBar.innerHTML = filtered.length === videos.length
      ? `<span>${videos.length}</span> videos`
      : `<span>${filtered.length}</span> de <span>${videos.length}</span> videos`;

    if (!filtered.length) {
      empty.style.display = 'block';
      return;
    }
    empty.style.display = 'none';
    filtered.forEach(v => grid.appendChild(buildCard(v)));
  }

  function buildCard(v) {
    const isFav    = favorites.includes(v.id);
    const hasNoMeta= !v.cat && !v.type && !v.equip && !v.ind;
    const metaStr  = [v.cat, v.type].filter(Boolean).join(' · ') || v.ind || '';

    const card = document.createElement('div');
    card.className = 'card';

    // Punto naranja si no hay metadatos
    if (hasNoMeta) {
      const dot = document.createElement('div');
      dot.className = 'dot-incomplete';
      dot.title = 'Sin metadatos completados';
      card.appendChild(dot);
    }

    // Thumbnail
    const thumbWrap = document.createElement('div');
    thumbWrap.className = 'thumb-wrap';

    const skel = document.createElement('div');
    skel.className = 'skeleton';

    const placeholder = document.createElement('div');
    placeholder.className = 'thumb-placeholder hidden';
    placeholder.textContent = '▶';

    const img = document.createElement('img');
    img.alt     = v.name;
    img.loading = 'lazy';
    img.decoding= 'async';

    if (v.fileId) {
      img.src = thumbUrl(v.fileId);

      img.addEventListener('load', () => {
        img.classList.add('loaded');
        skel.classList.add('hidden');
        placeholder.classList.add('hidden');
      });

      // Primer error: intentar URL alternativa
      img.addEventListener('error', () => {
        img.src = thumbUrlFallback(v.fileId);

        // Segundo error: mostrar placeholder
        img.addEventListener('error', () => {
          skel.classList.add('hidden');
          img.style.display = 'none';
          placeholder.classList.remove('hidden');
        }, { once: true });
      }, { once: true });

    } else {
      skel.classList.add('hidden');
      placeholder.classList.remove('hidden');
    }

    const playOver = document.createElement('div');
    playOver.className = 'play-overlay';
    playOver.innerHTML = '<div class="play-icon">▶</div>';

    thumbWrap.appendChild(skel);
    thumbWrap.appendChild(placeholder);
    thumbWrap.appendChild(img);
    thumbWrap.appendChild(playOver);

    // Body
    const body  = document.createElement('div');
    body.className = 'card-body';

    const title = document.createElement('div');
    title.className = 'card-title';
    title.textContent = v.name;

    const meta = document.createElement('div');
    meta.className = 'card-meta';
    meta.textContent = metaStr;

    body.appendChild(title);
    if (metaStr) body.appendChild(meta);

    // Estrella favorito
    const star = document.createElement('button');
    star.className = 'star-btn' + (isFav ? ' fav' : '');
    star.textContent = isFav ? '★' : '☆';
    star.title = isFav ? 'Quitar de favoritos' : 'Agregar a favoritos';
    star.addEventListener('click', e => {
      e.stopPropagation();
      toggleFav(v.id, star);
    });

    card.appendChild(thumbWrap);
    card.appendChild(body);
    card.appendChild(star);
    card.addEventListener('click', () => openModal(v));

    return card;
  }

  // ── FAVORITOS ────────────────────────────────────────────────────────
  function toggleFav(id, btn) {
    const idx = favorites.indexOf(id);
    if (idx === -1) {
      favorites.push(id);
      btn.textContent = '★';
      btn.classList.add('fav');
      btn.title = 'Quitar de favoritos';
    } else {
      favorites.splice(idx, 1);
      btn.textContent = '☆';
      btn.classList.remove('fav');
      btn.title = 'Agregar a favoritos';
    }
    localStorage.setItem('hc_favs', JSON.stringify(favorites));
    buildChips();
  }

  // ── MODAL ────────────────────────────────────────────────────────────
  function openModal(v) {
    currentVideo = v;
    document.getElementById('modal-title').textContent = v.name;

    // Metadatos
    const metaEl = document.getElementById('modal-meta');
    metaEl.innerHTML = '';
    [v.cat, v.type, v.equip, v.ind].filter(Boolean).forEach(m => {
      const tag = document.createElement('span');
      tag.className = 'meta-tag';
      tag.textContent = m;
      metaEl.appendChild(tag);
    });

    // Link directo a Drive (siempre visible, discreto)
    const driveUrl = v.link.replace('/preview', '/view');
    document.getElementById('drive-link').href = driveUrl;

    // Limpiar iframe anterior
    const wrap = document.getElementById('video-wrap');
    const existingIframe = wrap.querySelector('iframe');
    if (existingIframe) existingIframe.remove();

    // Mostrar spinner de carga
    const loadingEl = document.getElementById('video-loading');
    loadingEl.classList.remove('hidden');

    // Crear iframe
    const iframe = document.createElement('iframe');
    iframe.allowFullscreen = true;
    iframe.allow = 'autoplay; fullscreen';
    iframe.src   = v.link; // Ya está en formato /preview

    // Ocultar spinner cuando el iframe carga
    iframe.addEventListener('load', () => {
      loadingEl.classList.add('hidden');
    });

    wrap.appendChild(iframe);

    document.getElementById('modal').classList.add('open');
    document.body.style.overflow = 'hidden';
  }

  function closeModal() {
    document.getElementById('modal').classList.remove('open');
    document.body.style.overflow = '';

    // Detener el video removiendo el iframe
    const wrap = document.getElementById('video-wrap');
    const iframe = wrap.querySelector('iframe');
    if (iframe) iframe.remove();

    // Resetear spinner
    document.getElementById('video-loading').classList.remove('hidden');

    currentVideo = null;
  }

  document.getElementById('modal-close').addEventListener('click', closeModal);
  document.getElementById('modal').addEventListener('click', e => {
    if (e.target === document.getElementById('modal')) closeModal();
  });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

  // ── SEARCH ───────────────────────────────────────────────────────────
  let searchTimer;
  document.getElementById('search').addEventListener('input', () => {
    clearTimeout(searchTimer);
    searchTimer = setTimeout(renderCards, 220);
  });

  // ── VIEW TOGGLE ──────────────────────────────────────────────────────
  document.getElementById('btn-view').addEventListener('click', () => {
    listMode = !listMode;
    localStorage.setItem('hc_view', listMode ? 'list' : 'grid');
    applyPrefs();
    renderCards();
  });

  // ── HIGH CONTRAST ────────────────────────────────────────────────────
  document.getElementById('btn-hc').addEventListener('click', () => {
    highContrast = !highContrast;
    localStorage.setItem('hc_hc', highContrast ? '1' : '0');
    applyPrefs();
  });

  // ── FAB ──────────────────────────────────────────────────────────────
  const fab = document.getElementById('fab');
  window.addEventListener('scroll', () => {
    fab.classList.toggle('show', window.scrollY > 300);
  });
  fab.addEventListener('click', () => window.scrollTo({ top: 0, behavior: 'smooth' }));

  // ── SERVICE WORKER ───────────────────────────────────────────────────
  // Estrategia: registrar con ?v= para que el navegador siempre
  // verifique si cambió el archivo sw.js al desplegar una actualización.
  if ('serviceWorker' in navigator) {
    // Versión: actualizar este número con cada deploy
    const SW_VERSION = '20260523';
    navigator.serviceWorker.register('sw.js?v=' + SW_VERSION)
      .then(reg => {
        // Forzar verificación de actualización en cada carga de página
        reg.update();
        // Si hay un nuevo SW esperando, activarlo de inmediato
        if (reg.waiting) {
          reg.waiting.postMessage({ type: 'SKIP_WAITING' });
        }
        reg.addEventListener('updatefound', () => {
          const newSW = reg.installing;
          if (newSW) {
            newSW.addEventListener('statechange', () => {
              if (newSW.state === 'installed' && navigator.serviceWorker.controller) {
                // Nuevo SW instalado: recargar para activarlo
                window.location.reload();
              }
            });
          }
        });
      })
      .catch(err => console.warn('[SW] No se pudo registrar:', err));
  }
</script>
